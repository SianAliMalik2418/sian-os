<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b0d" />
    <title>Sian OS Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090b0d;
        color: #f5f7fa;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 0%, rgb(45 93 72 / 28%), transparent 36%),
          #090b0d;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 8px;
        padding: 24px;
        background: rgb(14 17 20 / 86%);
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.2;
      }

      p {
        margin: 12px 0 0;
        color: #a7b0bb;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sian OS is offline</h1>
      <p>Reconnect to load the latest check-ins, reports, and profile data.</p>
    </main>
  </body>
</html>
